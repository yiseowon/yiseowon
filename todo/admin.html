<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>todo · manage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>todo</h1>

  <div id="login" class="login-box" hidden>
    <p>수정하려면 로그인이 필요해요.</p>
    <a class="login-btn" href="https://yiseowon-todo-auth.seowonyitodo.workers.dev/login">GitHub으로 로그인</a>
  </div>

  <div id="manager" hidden>
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden>지금은 할 일이 없어요.</div>
    <div class="add-row">
      <input id="input" type="text" placeholder="할 일 추가" maxlength="120">
      <button id="add">추가</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <a class="back" href="index.html">← 목록만 보기</a>
</div>

<script>
const REPO = "yiseowon/yiseowon";
const FILE_PATH = "todo/todo.json";
const API = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;

const loginBox = document.getElementById("login");
const manager = document.getElementById("manager");
const list = document.getElementById("list");
const empty = document.getElementById("empty");
const status = document.getElementById("status");
const input = document.getElementById("input");
const addBtn = document.getElementById("add");

let token = null;
let sha = null;
let items = [];
let busy = false;

function setStatus(text, isError) {
  status.textContent = text || "";
  status.classList.toggle("error", !!isError);
}

function getTokenFromHash() {
  const match = location.hash.match(/token=([^&]+)/);
  if (!match) return null;
  history.replaceState(null, "", location.pathname);
  return match[1];
}

async function githubRequest(url, options = {}) {
  const res = await fetch(url, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: "application/vnd.github+json",
      ...options.headers,
    },
  });
  return res;
}

function toBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function fromBase64(str) {
  return decodeURIComponent(escape(atob(str)));
}

async function loadTodos() {
  const res = await githubRequest(API);

  if (res.status === 404) {
    sha = null;
    items = [];
    render();
    return;
  }

  if (!res.ok) {
    throw new Error(`불러오기 실패 (${res.status})`);
  }

  const data = await res.json();
  sha = data.sha;
  items = JSON.parse(fromBase64(data.content));
  render();
}

async function saveTodos(message) {
  const body = {
    message,
    content: toBase64(JSON.stringify(items, null, 2)),
    branch: "main",
  };
  if (sha) body.sha = sha;

  const res = await githubRequest(API, {
    method: "PUT",
    body: JSON.stringify(body),
  });

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    if (res.status === 403 || res.status === 404) {
      throw new Error("이 계정은 수정 권한이 없어요");
    }
    throw new Error(data.message || `저장 실패 (${res.status})`);
  }

  const data = await res.json();
  sha = data.content.sha;
}

function render() {
  list.innerHTML = "";
  empty.hidden = items.length !== 0;

  for (const item of items) {
    const li = document.createElement("li");
    if (item.done) li.classList.add("done");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = item.done;
    checkbox.addEventListener("change", () => toggleItem(item.id));

    const text = document.createElement("span");
    text.className = "text";
    text.textContent = item.text;

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "삭제";
    del.addEventListener("click", () => deleteItem(item.id));

    li.append(checkbox, text, del);
    list.appendChild(li);
  }
}

async function withBusy(fn, message) {
  if (busy) return;
  busy = true;
  setStatus(message ? `${message}...` : "처리 중...");
  try {
    await fn();
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    busy = false;
  }
}

async function toggleItem(id) {
  const target = items.find((i) => i.id === id);
  if (!target) return;
  target.done = !target.done;
  render();
  await withBusy(() => saveTodos(`toggle: ${target.text}`), "저장 중");
}

async function deleteItem(id) {
  const target = items.find((i) => i.id === id);
  if (!target) return;
  items = items.filter((i) => i.id !== id);
  render();
  await withBusy(() => saveTodos(`remove: ${target.text}`), "저장 중");
}

async function addItem() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  items.unshift({ id: crypto.randomUUID(), text, done: false });
  render();
  await withBusy(() => saveTodos(`add: ${text}`), "저장 중");
}

addBtn.addEventListener("click", addItem);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") addItem();
});

async function init() {
  token = getTokenFromHash() || sessionStorage.getItem("gh_token");
  if (!token) {
    loginBox.hidden = false;
    return;
  }
  sessionStorage.setItem("gh_token", token);

  manager.hidden = false;
  await withBusy(loadTodos, "불러오는 중");
}

init();
</script>
</body>
</html>
